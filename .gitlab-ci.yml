---
default:
  image: 'cr.selcloud.ru/podumai/ci/alpine:1.2'

stages:
  - 'lint'
  - 'release'

workflow:
  auto_cancel:
    on_new_commit: 'none'
    on_job_failure: 'none'

commit-lint:
  stage: 'lint'
  before_script:
    - 'pnpm install --frozen-lockfile'
  script:
    - 'pnpm exec commitlint --config commitlint.config.mjs --from HEAD~1 --to HEAD --verbose'

cmake-lint:
  stage: 'lint'
  image: 'astral/uv:0.12'
  needs: [ 'commit-lint' ]
  rules:
    - changes:
        paths:
          - '**/CMakeLists.txt'
          - '**/*.cmake'
  before_script:
    - 'uv sync --frozen'
  script:
    - 'uv run cmake-lint "$CI_PROJECT_DIR/**/CMakeLists.txt" "$CI_PROJECT_DIR/**/*.cmake"'

yaml-lint:
  stage: 'lint'
  image: '$INFRASTRUCTURE_CONTAINER_REGISTRY/ci/yamllint:0.0.3'
  needs: [ 'commit-lint' ]
  rules:
    - changes:
        paths:
          - '**/*.yaml'
          - '**/*.yml'
  script:
    - 'yamllint -c "$CI_PROJECT_DIR/.yamllint.yaml" .'

protobuf-lint:
  stage: 'lint'
  needs: [ 'commit-lint' ]
  rules:
    - changes:
        - 'proto/**/*.proto'
  script:
    - 'buf lint --config buf.yaml'

release:
  stage: 'release'
  image: 'node:26.8.2-alpine3.23'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: 0
  before_script:
    - 'apk add --no-cache git=2.52.0-r0 ca-certificates=20260611-r0'
    # yamllint disable-line
    - >
      npm install -g semantic-release
        @semantic-release/commit-analyzer
        @semantic-release/release-notes-generator
        @semantic-release/changelog
        @semantic-release/git
        @semantic-release/gitlab
  script:
    - 'semantic-release'
...
