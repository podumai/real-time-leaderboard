---
stages:
  - 'lint'

workflow:
  auto_cancel:
    on_new_commit: 'none'
    on_job_failure: 'none'

commit-lint:
  stage: 'lint'
  image: 'cr.selcloud.ru/podumai/ci/alpine:1.2'
  before_script:
    - 'pnpm install --frozen-lockfile'
  script:
    - 'pnpm exec commitlint --config commitlint.config.mjs --from HEAD~1 --to HEAD --verbose'
...
